name: Fork builds

# Fork-only builds: a Linux AppImage and unsigned Windows packages (installer and
# portable zip) of main or any feature branch, as downloadable workflow artifacts.
# Mirrors the build-linux and build-windows jobs in package-release.yml, minus the
# signing secrets the release flow needs.
# Leave this file out of pull requests to the original SubMiner project.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: fork-appimage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            stats/node_modules
            vendor/texthooker-ui/node_modules
            vendor/subminer-yomitan/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', 'stats/bun.lock', 'vendor/texthooker-ui/bun.lock', 'vendor/subminer-yomitan/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd stats && bun install --frozen-lockfile

      - name: Build texthooker-ui
        run: |
          cd vendor/texthooker-ui
          bun install --frozen-lockfile
          bun run build

      - name: Build AppImage
        run: bun run build:appimage

      - name: Smoke packaged runtime assets
        shell: bash
        run: xvfb-run -a bun run test:package "dist/release/linux-unpacked/resources"

      - name: Name artifact after the branch and commit
        id: meta
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(dist/release/SubMiner-*.AppImage)
          if [ "${#appimages[@]}" -eq 0 ]; then
            echo "No AppImage was produced."
            ls -la dist/release
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          # Artifact names can't contain '/', so feat/foo becomes feat-foo.
          branch="${GITHUB_REF_NAME//\//-}"
          label="${branch}-${short_sha}"
          cp "${appimages[0]}" "dist/release/SubMiner-${label}.AppImage"
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubMiner-AppImage-${{ steps.meta.outputs.label }}
          path: dist/release/SubMiner-${{ steps.meta.outputs.label }}.AppImage
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            stats/node_modules
            vendor/texthooker-ui/node_modules
            vendor/subminer-yomitan/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', 'stats/bun.lock', 'vendor/texthooker-ui/bun.lock', 'vendor/subminer-yomitan/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd stats && bun install --frozen-lockfile

      - name: Build texthooker-ui
        shell: powershell
        run: |
          Set-Location vendor/texthooker-ui
          bun install --frozen-lockfile
          bun run build

      - name: Build unsigned Windows packages
        run: bun run build:win:unsigned

      - name: Smoke packaged runtime assets
        shell: bash
        run: bun run test:package "dist/release/win-unpacked/resources"

      - name: Name artifact after the branch and commit
        id: meta
        shell: bash
        run: |
          shopt -s nullglob
          packages=(dist/release/*.exe dist/release/*.zip)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No Windows package was produced."
            ls -la dist/release
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          # Artifact names can't contain '/', so feat/foo becomes feat-foo.
          branch="${GITHUB_REF_NAME//\//-}"
          echo "label=${branch}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubMiner-Windows-${{ steps.meta.outputs.label }}
          path: |
            dist/release/*.exe
            dist/release/*.zip
          if-no-files-found: error
          retention-days: 30
