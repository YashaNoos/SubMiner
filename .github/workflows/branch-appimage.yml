name: Branch AppImage

# Fork-only test build: produces a Linux AppImage of this branch as a
# downloadable workflow artifact. Mirrors the build-linux job in
# package-release.yml, minus the signing secrets the release flow needs.
on:
  push:
    branches:
      - feat/controller-hold-secondary-sub
  workflow_dispatch:

concurrency:
  group: branch-appimage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            stats/node_modules
            vendor/texthooker-ui/node_modules
            vendor/subminer-yomitan/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock', 'stats/bun.lock', 'vendor/texthooker-ui/bun.lock', 'vendor/subminer-yomitan/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd stats && bun install --frozen-lockfile

      - name: Build texthooker-ui
        run: |
          cd vendor/texthooker-ui
          bun install --frozen-lockfile
          bun run build

      - name: Build AppImage
        run: bun run build:appimage

      - name: Smoke packaged runtime assets
        shell: bash
        run: xvfb-run -a bun run test:package "dist/release/linux-unpacked/resources"

      - name: Name artifact after the commit
        id: meta
        shell: bash
        run: |
          shopt -s nullglob
          appimages=(dist/release/SubMiner-*.AppImage)
          if [ "${#appimages[@]}" -eq 0 ]; then
            echo "No AppImage was produced."
            ls -la dist/release
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          cp "${appimages[0]}" "dist/release/SubMiner-${short_sha}.AppImage"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubMiner-AppImage-${{ steps.meta.outputs.short_sha }}
          path: dist/release/SubMiner-${{ steps.meta.outputs.short_sha }}.AppImage
          if-no-files-found: error
          retention-days: 30
